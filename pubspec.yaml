name: postpal
description: PostPal - plan, shoot, edit and post on Instagram with natural, human-looking content.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.0
  timezone: any
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  image: ^4.5.4
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  gal: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
